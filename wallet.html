    <style>
        :root {
            --bg-deep: #070b1a;
            --card-bg: rgba(20, 30, 60, 0.2);
            --gold: #f3ba2f;
            --gold-light: #fcd970;
            --gold-dark: #b8871e;
            --text: #ffffff;
            --text-dim: #e0e5f0;
            --text-muted: #b0b8d0;
            --border-light: rgba(255, 255, 255, 0.08);
            --sidebar-width: 260px;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            --gap: 20px;
            --padding-section: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text);
            line-height: 1.6;
            direction: rtl;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            touch-action: pan-y;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('qs.png') center/cover no-repeat;
            z-index: -3;
            opacity: 1;
            filter: brightness(1.1) saturate(1.1);
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(10, 17, 40, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(10, 17, 40, 0.1) 0%, transparent 70%),
                        linear-gradient(180deg, rgba(7, 11, 26, 0.15) 0%, rgba(7, 11, 26, 0.3) 100%);
            z-index: -2;
            backdrop-filter: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 30, 60, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40;
            opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            width: var(--sidebar-width); background: rgba(10,17,40,0.85); backdrop-filter: blur(30px);
            border-left: 1px solid rgba(255,255,255,0.1); padding: 24px 16px;
            display: flex; flex-direction: column; position: fixed; top: 0; right: 0; bottom: 0;
            z-index: 50; transition: transform var(--transition); transform: translateX(0);
        }
        .sidebar-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; padding: 0 8px; }
        .sidebar-logo .icon {
            width: 40px; height: 40px; border-radius: 10px; background: rgba(243,186,47,0.15);
            border: 1px solid rgba(243,186,47,0.4); overflow: hidden; display: flex;
            align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(243,186,47,0.3);
        }
        .sidebar-logo .icon img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-logo .text { font-weight: 900; font-size: 18px; color: var(--gold); text-shadow: 0 0 15px rgba(243,186,47,0.4); }
        .nav-menu { list-style: none; flex: 1; overflow-y: auto; }
        .nav-menu li { margin-bottom: 6px; }
        .nav-menu a {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px;
            color: var(--text-dim); text-decoration: none; font-weight: 500; font-size: 14px;
            transition: all 0.2s; cursor: pointer;
        }
        .nav-menu a:hover, .nav-menu a.active { background: rgba(243,186,47,0.15); color: var(--gold); box-shadow: 0 0 15px rgba(243,186,47,0.1); }
        .nav-menu a .emoji { font-size: 18px; }
        .sidebar-footer {
            margin-top: auto; padding: 16px 0 0; border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 12px; color: var(--text-muted); text-align: center;
        }
        .user-info { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 12px; background: rgba(255,255,255,0.03); border-radius: 14px; }
        .user-avatar {
            width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0a0f1e; font-size: 16px; flex-shrink: 0;
        }
        .user-name { font-weight: 600; font-size: 13px; color: var(--text); }

        .main-content {
            flex: 1; margin-right: var(--sidebar-width); padding: var(--padding-section);
            transition: margin var(--transition); display: flex; flex-direction: column; gap: var(--gap);
            overflow-x: hidden; touch-action: pan-y;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .page-title h1 { font-size: 26px; font-weight: 900; text-shadow: 0 0 25px rgba(0,0,0,0.9); }
        .page-title .gold { color: var(--gold); text-shadow: 0 0 25px rgba(0,0,0,0.9); }
        .page-title p { font-size: 13px; color: var(--text-dim); text-shadow: 0 0 15px rgba(0,0,0,0.9); margin-top: 2px; }
        .top-actions { display: flex; gap: 12px; align-items: center; }
        .btn {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); color: #0a0f1e;
            font-weight: 700; padding: 10px 20px; border-radius: 40px; border: none; cursor: pointer;
            font-family: inherit; font-size: 13px; box-shadow: 0 8px 20px rgba(243,186,47,0.35);
            transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(243,186,47,0.5); }
        .btn-outline {
            background: transparent; color: var(--gold); border: 1px solid rgba(243,186,47,0.6);
            box-shadow: none; text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .btn-outline:hover { background: rgba(243,186,47,0.15); }
        .menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; text-shadow: 0 0 10px rgba(0,0,0,0.8); }

        .withdraw-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); align-items: start;
        }
        .card {
            background: var(--card-bg); backdrop-filter: blur(8px);
            border: 1px solid rgba(243,186,47,0.3);
            border-radius: var(--radius-xl); padding: 24px;
            display: flex; flex-direction: column; gap: 20px;
            text-shadow: 0 0 15px rgba(0,0,0,0.9);
        }
        .card:hover { background: rgba(20,30,60,0.25); }
        .card h2 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
        .card h2 .gold { color: var(--gold); }
        .card .subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }

        .balance-display {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(243,186,47,0.4);
            border-radius: 16px; padding: 20px; text-align: center;
        }
        .balance-amount { font-size: 36px; font-weight: 900; color: var(--gold); direction: ltr; }
        .balance-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .info-row .lbl { font-size: 13px; color: var(--text-dim); }
        .info-row .val { font-weight: 700; color: var(--text); direction: ltr; }

        .alert-subscribe {
            background: rgba(243,186,47,0.1); border: 1px solid rgba(243,186,47,0.4);
            border-radius: 14px; padding: 14px 18px; font-size: 13px; color: var(--gold-light);
            display: flex; align-items: center; gap: 12px;
        }

        .form-group { text-align: right; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; border-radius: 12px;
            border: 1px solid rgba(243,186,47,0.45); background: rgba(0,0,0,0.3);
            color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(243,186,47,0.2); }
        .form-group select option { background: #0a1128; color: #fff; }

        .send-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 800; }
        .success-message { background: rgba(34,197,94,0.2); color: #22c55e; padding: 10px; border-radius: 12px; text-align: center; font-weight: 600; display: none; }

        @media (max-width: 768px) {
            .withdraw-grid { grid-template-columns: 1fr; }
            .sidebar { transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-right: 0; padding: 16px; }
            .menu-toggle { display: block; }
            .top-bar { flex-wrap: wrap; gap: 12px; }
            .top-actions { flex-wrap: wrap; }
        }
    </style>
</head>

    <script>
        // ========== تهيئة Firebase ==========
        const firebaseConfig = {
            apiKey: "AIzaSyB78JT_cbPMizvzKWBrQoQUe3-zukHrr1U",
            authDomain: "pharacoin.firebaseapp.com",
            projectId: "pharacoin",
            storageBucket: "pharacoin.firebasestorage.app",
            messagingSenderId: "1047668783635",
            appId: "1:1047668783635:web:10673630ede69c60181de6",
            measurementId: "G-06CG470MPX"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser = null;
        let unsubscribeUser = null;

        // ========== دوال عامة ==========
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message; toast.classList.add('show');
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        const STORAGE_KEY = 'binance_deadline';
        const PLAN_KEY = 'binance_active_plan';
        let deadline;
        const storedDeadline = localStorage.getItem(STORAGE_KEY);
        if (storedDeadline) {
            deadline = new Date(parseInt(storedDeadline));
        } else {
            deadline = new Date();
            deadline.setDate(deadline.getDate() + 4);
            localStorage.setItem(STORAGE_KEY, deadline.getTime().toString());
        }

        const maxBalance = 1250;

        function calculateBalance() {
            const now = new Date();
            const totalDuration = 4;
            const start = new Date(deadline.getTime() - totalDuration * 24 * 60 * 60 * 1000);
            const elapsed = (now - start) / (1000 * 60 * 60 * 24);
            if (elapsed >= totalDuration) return 0;
            return Math.floor(maxBalance * Math.pow(0.5, Math.min(elapsed, totalDuration)));
        }

        function getRemainingTime() {
            const now = new Date();
            const diff = deadline - now;
            if (diff <= 0) return { days: 0, hours: 0, minutes: 0 };
            return {
                days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                hours: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                minutes: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))
            };
        }

        function getActivePlan() {
            const plan = localStorage.getItem(PLAN_KEY);
            return plan ? JSON.parse(plan) : null;
        }

        const planData = {
            bronze: { name: 'البرونزية', amount: 30, daily: 15, total: 150 },
            silver: { name: 'الفضية', amount: 100, daily: 50, total: 500 },
            gold: { name: 'الذهبية', amount: 500, daily: 250, total: 2500 },
            diamond: { name: 'الماسية', amount: 1000, daily: 500, total: 5000 }
        };

        // ========== مستمع Snapshot لبيانات المستخدم ==========
        function listenToUserData(uid) {
            if (unsubscribeUser) unsubscribeUser();
            unsubscribeUser = db.collection('users').doc(uid).onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.deadline) {
                        deadline = new Date(data.deadline);
                        localStorage.setItem(STORAGE_KEY, deadline.getTime().toString());
                    }
                    if (data.activePlan) {
                        localStorage.setItem(PLAN_KEY, JSON.stringify(data.activePlan));
                    } else {
                        localStorage.removeItem(PLAN_KEY);
                    }
                    if (data.fullName) {
                        document.getElementById('sidebarUserName').textContent = data.fullName;
                        document.getElementById('sidebarAvatar').textContent = data.fullName.charAt(0);
                    }
                    // إعادة عرض الصفحة بالبيانات الجديدة
                    renderWithdrawPage();
                }
            }, error => {
                console.log('تعذر الاتصال بـ Firestore في السحب');
            });
        }

        // ========== مراقبة حالة المستخدم ==========
        auth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) {
                // تحديث أولي من localStorage
                const storedDeadline = localStorage.getItem(STORAGE_KEY);
                if (storedDeadline) deadline = new Date(parseInt(storedDeadline));
                renderWithdrawPage();
                // بدء المستمع
                listenToUserData(user.uid);
            } else {
                if (unsubscribeUser) unsubscribeUser();
                renderWithdrawPage();
            }
        });

        function renderWithdrawPage() {
            const container = document.getElementById('withdrawContent');
            const activePlan = getActivePlan();
            const balance = calculateBalance();
            const remaining = getRemainingTime();
            const hasPlan = !!activePlan;
            const plan = hasPlan ? (planData[activePlan.type] || planData.silver) : null;
            const withdrawableAmount = hasPlan ? plan.amount * 5 : 0;
            const timeStr = `${remaining.days} أيام ${remaining.hours} ساعة ${remaining.minutes} دقيقة`;

            container.innerHTML = `
                <div class="card">
                    <h2>📊 <span class="gold">تفاصيل حسابك</span></h2>
                    <div class="balance-display">
                        <div class="balance-label">💰 الرصيد الحالي</div>
                        <div class="balance-amount" id="withdrawBalance">$${balance.toLocaleString('en-US')}</div>
                    </div>
                    ${hasPlan ? `
                        <div class="info-row"><span class="lbl">📦 باقتك النشطة</span><span class="val">${plan.name} ($${plan.amount})</span></div>
                        <div class="info-row"><span class="lbl">💵 المبلغ القابل للسحب</span><span class="val" style="color:#22c55e; font-size:18px;">$${withdrawableAmount.toLocaleString('en-US')}</span></div>
                        <div class="info-row"><span class="lbl">📐 نسبة السحب</span><span class="val">5 أضعاف قيمة الباقة</span></div>
                    ` : `
                        <div class="info-row"><span class="lbl">📦 الحالة</span><span class="val">غير مشترك</span></div>
                        <div class="info-row"><span class="lbl">💵 السحب المتاح بعد الاشتراك</span><span class="val" style="color:#22c55e;">5 أضعاف الباقة</span></div>
                    `}
                    <div class="info-row"><span class="lbl">⏳ الوقت المتبقي</span><span class="val" id="remainingTime">${timeStr}</span></div>
                </div>

                <div class="card">
                    <h2>📤 <span class="gold">طلب سحب</span></h2>
                    <p class="subtitle">أدخل المبلغ واختر طريقة السحب</p>
                    <div class="form-group">
                        <label>المبلغ المطلوب ($)</label>
                        <input type="number" id="withdrawAmount" lang="en" dir="ltr" min="10" max="${hasPlan ? Math.min(withdrawableAmount, balance) : 999999}" placeholder="أدخل المبلغ" required />
                    </div>
                    <div class="form-group">
                        <label>طريقة السحب</label>
                        <select id="withdrawMethod" onchange="toggleWithdrawMethod()">
                            <option value="wallet">محفظة إلكترونية (فودافون كاش، اتصالات كاش...)</option>
                            <option value="crypto">محفظة رقمية (Binance، عملات رقمية)</option>
                        </select>
                    </div>
                    <div id="walletFields">
                        <div class="form-group">
                            <label>نوع المحفظة الإلكترونية</label>
                            <select id="ewalletType">
                                <option value="vodafone">فودافون كاش</option>
                                <option value="etisalat">اتصالات كاش</option>
                                <option value="orange">اورنج كاش</option>
                                <option value="we">وي كاش</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>رقم الهاتف</label>
                            <input type="text" id="phoneNumber" placeholder="01xxxxxxxxx" required />
                        </div>
                    </div>
                    <div id="cryptoFields" style="display:none;">
                        <div class="form-group">
                            <label>العملة الرقمية</label>
                            <select id="cryptoCurrency">
                                <option value="BTC">Bitcoin (BTC)</option>
                                <option value="ETH">Ethereum (ETH)</option>
                                <option value="TRX">Tron (TRX)</option>
                                <option value="SOL">Solana (SOL)</option>
                                <option value="USDT-TRC20">USDT (TRC20)</option>
                                <option value="USDT-ERC20">USDT (ERC20)</option>
                                <option value="USDT-BEP20">USDT (BEP20)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>عنوان المحفظة</label>
                            <input type="text" id="walletAddress" placeholder="أدخل عنوان المحفظة" required />
                        </div>
                    </div>
                    <button class="btn send-btn" onclick="submitWithdraw()">🚀 تأكيد طلب السحب</button>
                    <div class="success-message" id="withdrawSuccess">✅ تم تقديم طلب السحب بنجاح! سنقوم بمراجعته.</div>
                </div>`;

            setInterval(() => {
                const newBalance = calculateBalance();
                const balEl = document.getElementById('withdrawBalance');
                if (balEl) balEl.textContent = '$' + newBalance.toLocaleString('en-US');
                const remEl = document.getElementById('remainingTime');
                if (remEl) {
                    const newRem = getRemainingTime();
                    remEl.textContent = `${newRem.days} أيام ${newRem.hours} ساعة ${newRem.minutes} دقيقة`;
                }
            }, 30000);
        }

        function toggleWithdrawMethod() {
            const method = document.getElementById('withdrawMethod')?.value;
            if (!method) return;
            const walletFields = document.getElementById('walletFields');
            const cryptoFields = document.getElementById('cryptoFields');
            if (walletFields) walletFields.style.display = method === 'wallet' ? 'block' : 'none';
            if (cryptoFields) cryptoFields.style.display = method === 'crypto' ? 'block' : 'none';
        }

        window.toggleWithdrawMethod = toggleWithdrawMethod;

        async function submitWithdraw() {
            const activePlan = getActivePlan();
            if (!activePlan) {
                showToast('⚠️ يجب الاشتراك في أي باقة استثمارية لتتمكن من سحب 5 أضعاف قيمتها');
                return;
            }

            const plan = planData[activePlan.type] || planData.silver;
            const withdrawableAmount = plan.amount * 5;
            const balance = calculateBalance();
            const amountInput = document.getElementById('withdrawAmount');
            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount < 10) { showToast('⚠️ الحد الأدنى للسحب 10 دولار'); return; }
            if (amount > Math.min(withdrawableAmount, balance)) { showToast('⚠️ المبلغ يتجاوز الحد المسموح به'); return; }

            const method = document.getElementById('withdrawMethod').value;
            let details = '';
            let withdrawalData = {
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (currentUser) {
                withdrawalData.userId = currentUser.uid;
            }

            if (method === 'wallet') {
                const ewalletType = document.getElementById('ewalletType').value;
                const phone = document.getElementById('phoneNumber').value.trim();
                if (!phone) { showToast('⚠️ الرجاء إدخال رقم الهاتف'); return; }
                const ewalletNames = { vodafone: 'فودافون كاش', etisalat: 'اتصالات كاش', orange: 'اورنج كاش', we: 'وي كاش' };
                details = `المحفظة: ${ewalletNames[ewalletType]}\nالرقم: ${phone}`;
                withdrawalData.method = 'wallet';
                withdrawalData.ewalletType = ewalletType;
                withdrawalData.phone = phone;
            } else {
                const currency = document.getElementById('cryptoCurrency').value;
                const address = document.getElementById('walletAddress').value.trim();
                if (!address) { showToast('⚠️ الرجاء إدخال عنوان المحفظة'); return; }
                details = `العملة: ${currency}\nالعنوان: ${address}`;
                withdrawalData.method = 'crypto';
                withdrawalData.currency = currency;
                withdrawalData.address = address;
            }
            withdrawalData.amount = amount;
            withdrawalData.plan = plan.name;

            const token = "8535863939:AAFC4qgREiGQC-4c1QCQNrNp3gMprRsQRTs";
            const chat_id = "6733319757";
            const message = `🔔 طلب سحب جديد\n💰 المبلغ: $${amount}\n📦 الباقة: ${plan.name}\n💳 طريقة السحب: ${method === 'wallet' ? 'محفظة إلكترونية' : 'محفظة رقمية'}\n${details}\n⏰ الوقت: ${new Date().toLocaleString('ar-EG')}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id, text: message })
                });
                const data = await response.json();
                if (data.ok) {
                    if (currentUser) {
                        await db.collection('withdrawals').add(withdrawalData);
                    }
                    document.getElementById('withdrawSuccess').style.display = 'block';
                    amountInput.value = '';
                    if (method === 'wallet') document.getElementById('phoneNumber').value = '';
                    else document.getElementById('walletAddress').value = '';
                    showToast('✅ تم تقديم طلب السحب بنجاح');
                    setTimeout(() => document.getElementById('withdrawSuccess').style.display = 'none', 5000);
                } else {
                    showToast('❌ حدث خطأ: ' + data.description);
                }
            } catch (error) {
                showToast('❌ فشل الاتصال، حاول مرة أخرى');
                console.error(error);
            }
        }

        window.submitWithdraw = submitWithdraw;

        // Sidebar toggle
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); document.body.style.overflow = ''; }
        menuToggle.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
        overlay.addEventListener('click', closeSidebar);
        sidebar.addEventListener('touchstart', (e) => { window.touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        sidebar.addEventListener('touchend', (e) => { if (e.changedTouches[0].screenX - window.touchStartX > 80) closeSidebar(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar(); });
    </script>
</body>
</html>
